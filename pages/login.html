<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — CinePlex</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<div id="toast" class="toast hidden"></div>

<div class="auth-page">
  <div class="auth-card">
    <a href="../index.html" class="auth-logo">CINE<span>PLEX</span></a>
    <p class="auth-subtitle">Your cinema, one tap away.</p>
    <h2 class="auth-form-title">Welcome Back</h2>

    <div id="errorMsg" style="display:none;background:rgba(224,48,48,.12);border:1px solid var(--red);color:var(--red);padding:12px 16px;border-radius:6px;font-size:13px;margin-bottom:20px"></div>

    <div class="form-group">
      <label>Email</label>
      <input id="email" type="email" class="form-control" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button id="loginBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:8px">
      Sign In
    </button>

    <div style="margin-top:18px;padding:14px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--text-muted)">
      <strong style="color:var(--gold)">Demo admin:</strong> admin@cineplex.com / admin123<br/>
      Or create your own free account →
    </div>

    <div class="auth-switch">
      Don't have an account? <a href="register.html" class="auth-link">Create one</a>
    </div>
  </div>
</div>

<script src="../js/tmdb.js"></script>
<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = '../index.html';

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('errorMsg');
    const btn      = document.getElementById('loginBtn');

    if (!email || !password) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.style.display = 'block';
      return;
    }

    btn.textContent = 'Signing in…';
    btn.disabled = true;
    errEl.style.display = 'none';

    try {
      const res = await Store.login({ email, password });
      Auth.save(res.token, { id: res.userId, name: res.name, email: res.email, role: res.role });
      window.location.href = '../index.html';
    } catch (err) {
      errEl.textContent = err.message || 'Invalid email or password.';
      errEl.style.display = 'block';
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
