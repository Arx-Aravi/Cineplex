<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — CinePlex</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<div id="toast" class="toast hidden"></div>

<div class="auth-page">
  <div class="auth-card">
    <a href="../index.html" class="auth-logo">CINE<span>PLEX</span></a>
    <p class="auth-subtitle">Book tickets. Skip the queues.</p>
    <h2 class="auth-form-title">Create Account</h2>

    <div id="errorMsg" style="display:none;background:rgba(224,48,48,.12);border:1px solid var(--red);color:var(--red);padding:12px 16px;border-radius:6px;font-size:13px;margin-bottom:20px"></div>
    <div id="successMsg" style="display:none;background:rgba(46,204,113,.12);border:1px solid var(--green);color:var(--green);padding:12px 16px;border-radius:6px;font-size:13px;margin-bottom:20px"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input id="name" type="text" class="form-control" placeholder="John Doe" autocomplete="name"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="email" type="email" class="form-control" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Phone (optional)</label>
      <input id="phone" type="tel" class="form-control" placeholder="+91 98765 43210"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password"/>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input id="confirm" type="password" class="form-control" placeholder="Repeat password" autocomplete="new-password"/>
    </div>
    <button id="registerBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:8px">
      Create Account
    </button>

    <div class="auth-switch" style="margin-top:20px">
      Already have an account? <a href="login.html" class="auth-link">Sign in</a>
    </div>
  </div>
</div>

<script src="../js/tmdb.js"></script>
<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = '../index.html';

  document.getElementById('registerBtn').addEventListener('click', async () => {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const phone    = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const errEl    = document.getElementById('errorMsg');
    const sucEl    = document.getElementById('successMsg');
    const btn      = document.getElementById('registerBtn');

    errEl.style.display = 'none';
    sucEl.style.display = 'none';

    if (!name || !email || !password) {
      errEl.textContent = 'Name, email and password are required.';
      errEl.style.display = 'block'; return;
    }
    if (password.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters.';
      errEl.style.display = 'block'; return;
    }
    if (password !== confirm) {
      errEl.textContent = 'Passwords do not match.';
      errEl.style.display = 'block'; return;
    }

    btn.textContent = 'Creating account…';
    btn.disabled = true;

    try {
      const res = await Store.register({ name, email, phone: phone || null, password });
      Auth.save(res.token, { id: res.userId, name: res.name, email: res.email, role: res.role });
      sucEl.textContent = 'Account created! Redirecting…';
      sucEl.style.display = 'block';
      setTimeout(() => window.location.href = '../index.html', 1000);
    } catch (err) {
      errEl.textContent = err.message || 'Registration failed. Try again.';
      errEl.style.display = 'block';
      btn.textContent = 'Create Account';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
