# ── Server ────────────────────────────────────────────────
server.port=8080

# ── MySQL ─────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────
jwt.secret=your_very_long_super_secret_jwt_key_change_in_production_min_256_bits
jwt.expiration=86400000

# ── Razorpay (TEST MODE) ──────────────────────────────────
# Get free test keys: razorpay.com → Sign up → Settings → API Keys → Generate Test Key
# Test mode = mock bank page, no real money moves. Never put the Key Secret in frontend code.
razorpay.key.id=rzp_test_YOUR_KEY_ID_HERE
razorpay.key.secret=YOUR_TEST_KEY_SECRET_HERE

# ── CORS ──────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500

# ── Logging ───────────────────────────────────────────────
logging.level.com.moviebooking=DEBUG
logging.level.org.springframework.security=INFO
